site-metrics-by-source:
  parameters:
    - $ref: './parameters.yaml#/siteId'
    - $ref: './parameters.yaml#/source'
    - $ref: './parameters.yaml#/metric'
  get:
    tags:
      - metrics
      - site
    summary: Retrieve site metrics by source
    description: |
      This endpoint is useful for retrieving site metrics by source.
    operationId: getSiteMetricsBySource
    responses:
      '200':
        description: A list of site metrics
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/SiteMetricList'
      '400':
        $ref: './responses.yaml#/400-no-site-id'
      '401':
        $ref: './responses.yaml#/401'
      '404':
        $ref: './responses.yaml#/404-site-not-found-with-id'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
page-metrics-by-source:
  parameters:
    - $ref: './parameters.yaml#/siteId'
    - $ref: './parameters.yaml#/source'
    - $ref: './parameters.yaml#/metric'
    - $ref: './parameters.yaml#/base64PageUrl'
  get:
    tags:
      - metrics
      - site
    summary: Retrieve page metrics by source
    description: |
      This endpoint is useful for retrieving page metrics by source.
      Currently only `organic-keywords` is supported as a metric and only for source `seo`.
    operationId: getPageMetricsBySource
    responses:
      '200':
        description: A list of page metrics
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PageMetricList'
      '400':
        $ref: './responses.yaml#/400-no-site-id'
      '401':
        $ref: './responses.yaml#/401'
      '404':
        $ref: './responses.yaml#/404-site-not-found-with-id'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
site-keyword-cpc:
  parameters:
    - $ref: './parameters.yaml#/siteId'
    - name: country
      in: query
      required: false
      description: |
        Semrush database / country code (case-insensitive ISO 3166-1 alpha-2, e.g. `us`, `gb`, `de`).
        Defaults to `us` when omitted.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Maximum number of organic keywords to return. Defaults to 1000; clamped to 10000.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1000
  get:
    tags:
      - metrics
      - site
    summary: Retrieve the site's organic keywords with CPC
    description: |
      Returns the site's organic keywords from Semrush together with their cost-per-click (CPC),
      the raw material for deriving per-topic CPC on the Return on Brand Visibility dashboard.
      `cpc` is expressed in integer US cents (Semrush `Cp` × 100); it is `0` when Semrush has no
      CPC for the keyword.
    operationId: getSiteKeywordCpc
    responses:
      '200':
        description: The site's organic keywords with CPC
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/KeywordCpcList'
      '400':
        $ref: './responses.yaml#/400-no-site-id'
      '401':
        $ref: './responses.yaml#/401'
      '404':
        $ref: './responses.yaml#/404-site-not-found-with-id'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
site-metrics-latest:
  get:
    operationId: getSiteLatestMetrics
    summary: Get latest site metrics
    description: |
      Retrieves the latest metrics for a specific site, including RUM (Real User Monitoring)
      data and organic traffic metrics. Returns zeroed values if no data is available or
      no RUM domain key is configured.
    parameters:
      - $ref: './parameters.yaml#/siteId'
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                pageViewsChange:
                  type: number
                  description: Percentage change in page views compared to the previous period (last 30 days vs prior 30 days)
                ctrChange:
                  type: number
                  description: Percentage change in Click-Through Rate (CTR) compared to the previous period
                projectedTrafficValue:
                  type: number
                  description: Projected traffic value based on page views change and cost per click
                currentPageViews:
                  type: number
                  description: Total page views for the current period (last 30 days)
                previousPageViews:
                  type: number
                  description: Total page views for the previous period (prior 30 days)
                currentLCP:
                  type: number
                  description: Current Largest Contentful Paint (LCP) metric in milliseconds for the last 30 days
                previousLCP:
                  type: number
                  description: Previous Largest Contentful Paint (LCP) metric in milliseconds for the prior 30 days
                currentEngagement:
                  type: number
                  description: Current engagement metric for the last 30 days
                previousEngagement:
                  type: number
                  description: Previous engagement metric for the prior 30 days
                currentConversion:
                  type: number
                  description: Current conversion (total clicks) for the last 30 days
                previousConversion:
                  type: number
                  description: Previous conversion (total clicks) for the prior 30 days
      '401':
        $ref: './responses.yaml#/401'
      '404':
        $ref: './responses.yaml#/404-site-not-found-with-id'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
    tags:
      - metrics
      - site
