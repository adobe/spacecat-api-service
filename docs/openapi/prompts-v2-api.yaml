# ── Brand-scoped prompts CRUD (Aurora) ──

v2-prompts-by-brand:
  parameters:
    - name: spaceCatId
      in: path
      required: true
      description: SpaceCat Organization ID (UUID)
      schema:
        type: string
        format: uuid
    - name: brandId
      in: path
      required: true
      description: Brand ID (UUID, config id, or brand name)
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 100
      description: Page size
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    - name: categoryId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Filter by category UUID (categories.id). A categoryId that does not
        resolve to a category in this organization returns an empty page
        (the filter fails closed; it is never silently dropped).
    - name: topicId
      in: query
      required: false
      schema:
        type: string
      description: Filter by topic business key
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, pending, deleted, expired]
      description: Filter by status; default excludes deleted and, when reconciliation is enabled, expired
    - name: search
      in: query
      required: false
      schema:
        type: string
      description: Free-text search across prompt text and name (ILIKE match)
    - name: region
      in: query
      required: false
      schema:
        type: string
      description: >-
        Filter by region code (e.g. `us`). Matches prompts whose `regions`
        array contains the value, case-insensitively — region codes are stored
        with inconsistent casing depending on the onboarding path, so both
        lower- and upper-case variants are matched.
    - name: origin
      in: query
      required: false
      schema:
        type: string
        enum: [ai, human]
      description: Filter by origin (ai or human)
    - name: source
      in: query
      required: false
      schema:
        type: string
      description: >-
        Filter by prompt source (the producing system), e.g. `gsc`, `semrush`,
        `base-url`, `config`. Matched on the canonical form, so `citation-attempt`
        also finds rows stored as `citation_attempt` (drift spellings fold
        together, case-insensitive). Free-form string — sources are open-ended and
        registered by the server.
    - name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [topic, prompt, category, origin, source, status, updatedAt]
      description: >-
        Sort column. Default is updatedAt descending. `source` sorts on the
        canonical form, so a producer's drift spellings (`citation_attempt` /
        `citation-attempt`) order together.
    - name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort direction. Default is desc
  get:
    tags:
      - customer-config
    summary: List prompts for a brand
    description: |
      Returns a paginated list of prompts for the given brand.
      Upsert uniqueness: match by id or by (text, regions).
    operationId: listPromptsByBrand
    security:
      - session_token: [ ]
      - api_key: [ ]
    responses:
      '200':
        description: Prompts retrieved successfully
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/V2PromptListResponse'
      '400':
        $ref: './responses.yaml#/400'
      '404':
        description: Organization or brand not found
      '503':
        description: PostgREST unavailable (DATA_SERVICE_PROVIDER=postgres required)
      '500':
        $ref: './responses.yaml#/500'
  post:
    tags:
      - customer-config
    summary: Create or upsert prompts (bulk)
    description: |
      Upserts prompts. Match by id or by (text, regions). If match found, update; else insert.
      The legacy request body is a prompt array. Service principals may instead send a
      generation envelope with `prompts`, `generationId`, `source`, and `reconcile: true`.
      After every prompt in the generation is written successfully, the server expires stale
      active/pending AI prompts for the same organization, brand, and canonical source. If the
      write fails, reconciliation does not run. If the configured fraction guard refuses the
      expiry, the prompt writes remain committed and the endpoint returns 409 with reconciliation
      counts so the service retry/alert path can stop the batch safely.

      If a matched prompt has status `deleted` or `expired`, it is reactivated to `active` and
      counted as updated. Prompts with status `ignored` remain unchanged. A generation-aware
      write touches a matched `pending` prompt's generation marker without changing its status.
    operationId: createPromptsByBrand
    security:
      - session_token: [ ]
      - api_key: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                minItems: 1
                maxItems: 3000
                items:
                  $ref: './schemas.yaml#/V2PromptInput'
              - type: object
                required: [prompts, generationId, source, reconcile]
                properties:
                  prompts:
                    type: array
                    minItems: 1
                    maxItems: 3000
                    items:
                      $ref: './schemas.yaml#/V2PromptInput'
                  generationId:
                    type: string
                    format: uuid
                    description: Service-generated identifier shared by every current prompt in this run.
                  source:
                    type: string
                    description: Registered generating pipeline source.
                  reconcile:
                    type: boolean
                    enum: [true]
                    description: Request stale-prompt reconciliation after the full write succeeds.
    responses:
      '201':
        description: Prompts created/updated
        content:
          application/json:
            schema:
              type: object
              properties:
                created:
                  type: integer
                updated:
                  type: integer
                prompts:
                  type: array
                  description: Simplified prompt objects (no uuid, category, or topic — use GET to fetch full details)
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Business key (prompt_id)
                      prompt:
                        type: string
                      regions:
                        type: array
                        items:
                          type: string
                      categoryId:
                        type:
                          - string
                          - 'null'
                      topicId:
                        type:
                          - string
                          - 'null'
                      status:
                        type: string
                      origin:
                        type: string
                      source:
                        type: string
                      updatedBy:
                        type:
                          - string
                          - 'null'
                      updatedAt:
                        type:
                          - string
                          - 'null'
                reconciliation:
                  type: object
                  description: Present for generation-envelope requests.
                  properties:
                    refused:
                      type: boolean
                    candidateCount:
                      type: integer
                    expiredCount:
                      type: integer
                    activeAfter:
                      type: integer
                    expireFraction:
                      type: number
                    skipped:
                      type: boolean
                    reason:
                      type: string
      '400':
        $ref: './responses.yaml#/400'
      '404':
        description: Organization or brand not found
      '409':
        description: >-
          Prompt writes completed, but stale-prompt reconciliation was refused
          by the configured expiry-fraction guard.
        content:
          application/json:
            schema:
              type: object
              required: [created, updated, prompts, reconciliation]
              properties:
                created:
                  type: integer
                updated:
                  type: integer
                prompts:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      prompt:
                        type: string
                      regions:
                        type: array
                        items:
                          type: string
                      status:
                        type: string
                      origin:
                        type: string
                      source:
                        type: string
                reconciliation:
                  type: object
                  required:
                    - refused
                    - candidateCount
                    - expiredCount
                    - activeAfter
                    - expireFraction
                  properties:
                    refused:
                      type: boolean
                      enum: [true]
                    candidateCount:
                      type: integer
                    expiredCount:
                      type: integer
                    activeAfter:
                      type: integer
                    expireFraction:
                      type: number
      '503':
        description: PostgREST unavailable
      '500':
        $ref: './responses.yaml#/500'

v2-prompts-by-brand-and-id:
  parameters:
    - name: spaceCatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: brandId
      in: path
      required: true
      schema:
        type: string
    - name: promptId
      in: path
      required: true
      schema:
        type: string
      description: prompt_id (business key)
  get:
    tags:
      - customer-config
    summary: Get a single prompt
    operationId: getPromptByBrandAndId
    security:
      - session_token: [ ]
      - api_key: [ ]
    responses:
      '200':
        description: Prompt retrieved
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/V2Prompt'
      '404':
        description: Organization, brand, or prompt not found
      '503':
        description: PostgREST unavailable
      '500':
        $ref: './responses.yaml#/500'
  patch:
    tags:
      - customer-config
    summary: Update a single prompt
    description: >-
      Updates a single prompt. `origin` is NOT patchable — it is fixed by the
      writer that created the row and is never re-derived on update
      (origin-dimension.md §3 item 3); an `origin` in the body is ignored,
      leaving the stored value untouched.
    operationId: updatePromptByBrandAndId
    security:
      - session_token: [ ]
      - api_key: [ ]
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/V2PromptInput'
    responses:
      '200':
        description: Prompt updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/V2Prompt'
      '404':
        description: Organization, brand, or prompt not found
      '503':
        description: PostgREST unavailable
      '500':
        $ref: './responses.yaml#/500'
  delete:
    tags:
      - customer-config
    summary: Soft-delete a prompt
    description: Sets status to 'deleted'.
    operationId: deletePromptByBrandAndId
    security:
      - session_token: [ ]
      - api_key: [ ]
    responses:
      '204':
        description: Prompt deleted
      '404':
        description: Organization, brand, or prompt not found
      '503':
        description: PostgREST unavailable
      '500':
        $ref: './responses.yaml#/500'

v2-prompts-by-brand-bulk-delete:
  parameters:
    - name: spaceCatId
      in: path
      required: true
      description: SpaceCat Organization ID (UUID)
      schema:
        type: string
        format: uuid
    - name: brandId
      in: path
      required: true
      description: Brand ID (UUID, config id, or brand name)
      schema:
        type: string
  post:
    tags:
      - customer-config
    summary: Bulk soft-delete prompts
    description: |
      Soft-deletes multiple prompts by setting their status to 'deleted'.
      Uses POST instead of DELETE because the body-data middleware does not parse DELETE request bodies.
      See ADR-001 for details.
    operationId: bulkDeletePromptsByBrand
    security:
      - session_token: [ ]
      - api_key: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/V2PromptBulkDeleteRequest'
    responses:
      '200':
        description: Bulk delete completed
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/V2PromptBulkDeleteResponse'
      '400':
        $ref: './responses.yaml#/400'
      '404':
        description: Organization or brand not found
      '503':
        description: PostgREST unavailable
      '500':
        $ref: './responses.yaml#/500'

v2-prompts-by-brand-check:
  parameters:
    - name: spaceCatId
      in: path
      required: true
      description: SpaceCat Organization ID (UUID)
      schema:
        type: string
        format: uuid
    - name: brandId
      in: path
      required: true
      description: Brand ID (UUID, config id, or brand name)
      schema:
        type: string
  post:
    tags:
      - customer-config
    summary: Batch prompt existence check
    description: |
      Given a list of {text, region} pairs, returns the subset that already
      exist in the prompts table for the given brand with status active,
      deleted, or ignored. Used by the UI to filter suggestion panels without
      fetching all paginated prompt pages client-side. Max 500 pairs per request.
      Region values are normalized to lowercase 2-char codes before comparison.
    operationId: checkPromptsByBrand
    security:
      - session_token: [ ]
      - api_key: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - prompts
            properties:
              prompts:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: object
                  required:
                    - text
                    - region
                  properties:
                    text:
                      type: string
                      maxLength: 2000
                      description: Prompt text to look up
                    region:
                      type: string
                      description: Region code (e.g. "US", "gb"). Normalized to lowercase 2-char before comparison.
    responses:
      '200':
        description: Existence check completed
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  description: Subset of the input pairs that already exist in the DB
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      region:
                        type: string
      '400':
        $ref: './responses.yaml#/400'
      '404':
        description: Organization or brand not found
      '503':
        description: PostgREST unavailable
      '500':
        $ref: './responses.yaml#/500'
