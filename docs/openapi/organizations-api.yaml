organizations:
  post:
    tags:
      - organization
    summary: Create a new organization
    description: |
      Creates a new organization (or returns the existing one with HTTP 200 if an organization
      with the same `imsOrgId` already exists).
    operationId: createOrganization
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/OrganizationCreate'
    responses:
      '200':
        description: Existing organization returned (idempotent create — an organization with the same `imsOrgId` already exists)
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Organization'
      '201':
        description: Organization created successfully
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Organization'
      '400':
        $ref: './responses.yaml#/400-empty-request-body-validation-failure'
      '401':
        $ref: './responses.yaml#/401'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - admin_key: [ ]
  get:
    tags:
      - organization
    summary: Retrieve all organizations
    description: |
      This endpoint is useful for retrieving all organizations.
    operationId: getOrganizations
    responses:
      '200':
        description: A list of organizations
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/OrganizationList'
      '401':
        $ref: './responses.yaml#/401'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]

organizations-by-product-code:
  get:
    tags:
      - organization
    summary: Retrieve all organizations onboarded for a product
    description: |
      Returns every organization that has at least one site onboarded (enrolled) for the
      given product code (e.g. `LLMO`). "Onboarded" means at least one of the organization's
      sites has a site-enrollment for an entitlement of that product; organizations that merely
      hold an entitlement but have onboarded no site are excluded. Admin-only, or an S2S consumer
      holding the `organization:readAll` capability.
    operationId: getOrganizationsByProductCode
    parameters:
      - name: productCode
        in: path
        description: The product code to filter organizations by.
        required: true
        schema:
          type: string
          enum:
            - LLMO
            - ASO
            - ACO
          example: LLMO
    responses:
      '200':
        description: A list of organizations onboarded for the product
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/OrganizationList'
      '400':
        $ref: './responses.yaml#/400'
      '401':
        $ref: './responses.yaml#/401'
      '403':
        $ref: './responses.yaml#/403'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]

organizations-by-access-map-sheet:
  get:
    tags:
      - organization
    summary: Retrieve organizations onboarded for a product, filtered by the caller's access-map grant
    description: |
      Returns organizations onboarded (enrolled) for the given product code, restricted to the
      subset the calling admin is permitted to see per an externally maintained customer
      access-map sheet. The caller's authenticated email is looked up in the sheet: if not
      present, every onboarded organization for the product is returned (unfiltered), matching
      `GET /organizations/by-product-code/{productCode}`. If present, only organizations whose
      IMS org ID has a non-expired grant for that email are returned — an email present but with
      only expired grants yields an empty list. Admin-only; unlike the sibling endpoint, S2S
      consumers are not permitted here. If the caller's token carries no resolvable email claim,
      the request is denied (`403`) rather than falling back to an unfiltered list — the endpoint
      never serves data when it cannot identify who is asking.
    operationId: getOrganizationsByAccessMapSheet
    parameters:
      - name: productCode
        in: path
        description: The product code to filter organizations by.
        required: true
        schema:
          type: string
          enum:
            - LLMO
            - ASO
            - ACO
          example: LLMO
    responses:
      '200':
        description: A list of organizations onboarded for the product, filtered by the caller's access-map grant
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/OrganizationList'
      '400':
        $ref: './responses.yaml#/400'
      '401':
        $ref: './responses.yaml#/401'
      '403':
        $ref: './responses.yaml#/403'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - admin_key: [ ]

organization-projects:
  get:
    tags:
      - organization
    summary: Retrieve all projects for an organization
    description: |
      This endpoint is useful for retrieving all projects belonging to a specific organization.
    operationId: getProjectsForOrganization
    parameters:
      - name: organizationId
        in: path
        description: The ID of the organization
        required: true
        schema:
          $ref: './schemas.yaml#/Id'
    responses:
      '200':
        description: A list of projects for the organization
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/Project'
      '401':
        $ref: './responses.yaml#/401'
      '404':
        $ref: './responses.yaml#/404-organization-not-found-with-id'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
      - session_token: [ ]
      - scoped_api_key: [ ]

organization-project-by-id:
  get:
    tags:
      - organization
    summary: Retrieve a specific project within an organization by ID
    description: |
      This endpoint is useful for retrieving a specific project by its ID within an organization.
    operationId: getOrganizationProjectById
    parameters:
      - name: organizationId
        in: path
        description: The ID of the organization
        required: true
        schema:
          $ref: './schemas.yaml#/Id'
      - name: projectId
        in: path
        description: The ID of the project
        required: true
        schema:
          $ref: './schemas.yaml#/Id'
    responses:
      '200':
        description: Project found
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Project'
      '401':
        $ref: './responses.yaml#/401'
      '403':
        $ref: './responses.yaml#/403'
      '404':
        $ref: './responses.yaml#/404-organization-not-found-with-id'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
      - session_token: [ ]
      - scoped_api_key: [ ]

