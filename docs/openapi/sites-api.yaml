        description: A list of sites with their latest audit
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/SiteWithLatestAuditList'
      '400':
        $ref: './responses.yaml#/400-no-audit-type'
      '401':
        $ref: './responses.yaml#/401'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
