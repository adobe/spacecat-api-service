sites-by-tier:
  parameters:
    - $ref: './parameters.yaml#/tier'
    - $ref: './parameters.yaml#/productCodeQuery'
    - $ref: './parameters.yaml#/fields'
  get:
    tags:
      - site
    summary: Retrieve all sites enrolled at a given entitlement tier
    description: |
      Returns sites whose organization has an entitlement at the requested tier
      (PAID, FREE_TRIAL, PLG, or PRE_ONBOARD) and that are enrolled into that entitlement.
      Optionally restrict to a single product via the `productCode` query
      parameter (e.g. LLMO). Results are ordered by site ID. Not paginated -
      admin-only, bounded use case. Supports the `fields` query parameter to
      project a subset of fields per site. Admin-only.
    operationId: getSitesByEnrollmentAndTier
    responses:
      '200':
        description: A list of sites
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/SiteEnrollmentList'
      '400':
        $ref: './responses.yaml#/400-no-tier'
      '401':
        $ref: './responses.yaml#/401'
      '403':
        $ref: './responses.yaml#/403'
      '500':
        $ref: './responses.yaml#/500'
    security:
      - api_key: [ ]
sites-with-latest-audit:
  parameters:
    - $ref: './parameters.yaml#/auditType'
    - $ref: './parameters.yaml#/fields'
  get:
    tags:
      - site
    summary: Retrieve all sites including their latest audit
    description: |
      This endpoint is useful for retrieving all sites including their latest audit.
      The latest audit is determined by the auditedAt property of the audit and
      included in the audits array of the site object.
    operationId: getSitesWithLatestAudit
    responses:
