name: CI

permissions:
  id-token: write
  contents: write
  issues: read
  pull-requests: write

on:
  push:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, edited]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy the serenity job runner worker to'
        required: true
        type: choice
        options: [dev, stage]
        default: dev

jobs:
  ci:
    uses: adobe/mysticat-ci/.github/workflows/service-ci.yaml@v3
    with:
      service-name: api-service
      validate-pr-title: true
      docs-lint: true
      it-postgres: true
      vpc-enabled: true
      bundle-build: true
    secrets: inherit

  # Opt-in TypeScript type-checking (checkJs + JSDoc, no .ts source) over the
  # `// @ts-check`-annotated files (currently src/support/serenity/**). Blocking.
  # The reusable service-ci workflow has no type-check seam yet, so this runs as
  # a self-contained job here. See docs/decisions/005-opt-in-type-checking.md.
  type-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Type-check
        run: npm run type-check

  # TEMPORARY probe (chore/sr-sdk-artifactory) - do NOT merge.
  # Answers whether a GitHub-hosted runner (public internet, off the Adobe corp
  # network) can reach the Adobe Artifactory npm remote proxy that fronts
  # Semrush's Google Artifact Registry, and whether off-corp read needs auth.
  # No secret used: the repo (npm-quazar-gar-tf-remote) allows anonymous read
  # from corp. This job proves or disproves that from CI before we commit to
  # un-vendoring @quazar/ai-seo-ts. Remove before the migration PR is finalized.
  sr-artifactory-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Prior run: the runner reaches the host but npm/curl fail TLS with
      # "unable to get local issuer certificate". From a corp-network machine the
      # cert chains cleanly to public DigiCert, so the runner must receive a
      # different chain. Read-only inspection to see what the runner actually gets
      # (DNS target + full TLS chain + issuers + verify code). No TLS disabling.
      - name: Inspect DNS + TLS chain from the runner
        run: |
          HOST=artifactory.corp.adobe.com
          echo "== DNS resolution on the runner =="
          getent ahosts "$HOST" || echo "(no getent result)"
          echo "== TLS chain the runner receives =="
          echo | openssl s_client -showcerts -connect "$HOST:443" -servername "$HOST" 2>/dev/null \
            | grep -E "^ *[0-9]+ s:|^ *i:|Verify return code|CONNECTED" \
            || echo "(openssl produced no chain output)"
      # The runner hits an Adobe Banyan (ZTNA) gateway whose cert chains to the
      # private "Adobe Enterprise Root CA". Trust that root (public cert, not a
      # secret) and see what the gateway does: HTTP 200 means CA trust was the
      # only barrier and read is anonymous; 401/403/redirect means the Zero Trust
      # gateway also enforces device/identity and public runners can't get in.
      - name: npm install with Adobe Enterprise Root CA trusted (the real fix)
        env:
          ADOBE_ROOT_CA_B64: 
        run: |
          echo "$ADOBE_ROOT_CA_B64" | base64 -d > /tmp/adobe-root.pem
          export NODE_EXTRA_CA_CERTS=/tmp/adobe-root.pem
          HOST=artifactory.corp.adobe.com
          REG="https://$HOST/artifactory/api/npm/npm-quazar-gar-tf-remote/"
          echo "== openssl verify with the root =="
          echo | openssl s_client -connect "$HOST:443" -servername "$HOST" -CAfile /tmp/adobe-root.pem 2>/dev/null \
            | grep "Verify return code" || echo "(no verify line)"
          echo "== curl the package metadata (--cacert) - watch the HTTP code =="
          curl -sS -o /dev/null -w "curl http_code=%{http_code}\n" --max-time 30 \
            --cacert /tmp/adobe-root.pem "${REG}@semrush%2fai-seo-ts" || echo "(curl connection failed)"
          WORK="$(mktemp -d)"; cd "$WORK"; npm init -y >/dev/null
          { echo "@semrush:registry=$REG"; echo "@quazar:registry=$REG"; } > .npmrc
          echo "== npm install (root CA trusted, no token) =="
          npm install @semrush/ai-seo-ts@0.102.1-gen2.7.0 && echo "INSTALL_OK"

  # Manually-triggered deploy for the serenity job runner worker (adobe/serenity-docs#186),
  # a second Lambda built from a distinct hedy --entryFile
  # (src/serenity-prompt-classification/index.js, deployed as
  # spacecat-services--serenity-job-runner) rather than the reusable service-ci
  # workflow's single deploy-dev/deploy-stage target, which has no seam for a
  # second Lambda per service.
  #
  # workflow_dispatch-only, not push-triggered: this still needs to happen
  # under CI's spacecat-role-github-actions (personal dev credentials lack the
  # iam:PassRole permission the reusable workflow's deploy jobs are granted),
  # but the worker isn't part of steady-state traffic yet
  # (create_serenity_job_runner_esms defaults false in every environment) -
  # tying it to every push would add permanent CI surface for a feature not
  # yet in continuous use. Trigger manually via the Actions tab or
  # `gh workflow run ci.yaml -f environment=dev`.
  #
  # Prod is intentionally not an option here: prod deploys go through
  # `npm run semantic-release` (an exec plugin, not a direct `npm run deploy`
  # call), which does not yet invoke deploy:worker. Wiring the worker into the
  # release process is a separate follow-up once it needs continuous prod
  # deployment.
  deploy-worker:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.environment == 'dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-worker-${{ inputs.environment }}
      cancel-in-progress: false
    needs: [ci]
    environment: ${{ inputs.environment == 'dev' && 'dev-branches' || 'stage' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Configure AWS
        uses: adobe/mysticat-ci/.github/actions/configure-aws@v1
        with:
          aws_role_to_assume: ${{ inputs.environment == 'dev'
            && format('arn:aws:iam::{0}:role/spacecat-role-github-actions', secrets.AWS_ACCOUNT_ID_DEV)
            || format('arn:aws:iam::{0}:role/spacecat-role-github-actions', secrets.AWS_ACCOUNT_ID_STAGE) }}

      - name: Deploy worker
        run: npm run ${{ inputs.environment == 'dev' && 'deploy-dev:worker' || 'deploy-stage:worker' }}
        env:
          AWS_REGION: us-east-1
          AWS_ACCOUNT_ID: ${{ inputs.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV || secrets.AWS_ACCOUNT_ID_STAGE }}
          VPC_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          VPC_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          VPC_SG_ID: ${{ secrets.VPC_SG_ID }}
