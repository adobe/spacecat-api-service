name: CI

permissions:
  id-token: write
  contents: write
  issues: read
  pull-requests: write

on:
  # `push:` stays unfiltered (all branches): the `type-check` push-fallback,
  # `semver-check`, and the reusable workflow's `branch-deploy` job (auto-deploy of
  # feature branches to the `dev-branches` env, which fires on push only) all run
  # on non-main branch pushes.
  push:
  pull_request:
    # `edited` removed: a PR title/body edit fired the full reusable CI (~23
    # billable job-min, ~5 org runner slots) only to re-check the title. Title
    # re-validation on edit now lives in the lightweight pr-title.yaml workflow.
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy the serenity job runner worker to'
        required: true
        type: choice
        options: [dev, stage, prod]
        default: dev

jobs:
  # The reusable CI runs on both `push` and `pull_request`, so for an open PR its
  # `build` + `it-postgres` would run twice per commit (the concurrency group keys
  # on `github.ref`, which differs between the two events, so they don't cancel
  # each other). `dedup-pr-runs: true` makes the shared service-ci workflow skip
  # the redundant `pull_request` copy of that heavy path for a same-repo PR: the
  # branch's `push` run covers the same head SHA and reports the required
  # `ci / build` + `ci / it-postgres`, so the `pull_request` copies come back
  # `skipped` and branch protection is satisfied by the push run.
  #
  # The `push` run is NEVER the one skipped, so `branch-deploy` (push-only,
  # auto-deploys feature branches to `dev-branches`) is preserved. Skipping the
  # push run instead is exactly what this repo's #3235 did — silently disabling
  # branch-deploy — which the shared dedup is designed to avoid. Fork PRs still
  # run the heavy path on `pull_request` (they have no base-repo push twin). See
  # mysticat-ci `.github/actions/ci-context/README.md`.
  #
  # The caller-side DRAFT-PR skip is kept and composes with the above: a draft PR
  # skips the whole `pull_request` `ci` job (the `push` run still covers the
  # required checks and runs branch-deploy), and `ready_for_review` re-triggers
  # the `pull_request` run — where the shared dedup then skips only build +
  # it-postgres.
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: adobe/mysticat-ci/.github/workflows/service-ci.yaml@v3
    with:
      service-name: api-service
      validate-pr-title: true
      docs-lint: true
      it-postgres: true
      vpc-enabled: true
      bundle-build: true
      dedup-pr-runs: true
    secrets: inherit

  # Opt-in TypeScript type-checking (checkJs + JSDoc, no .ts source) over the
  # `// @ts-check`-annotated files (currently src/support/serenity/**). Blocking.
  # The reusable service-ci workflow has no type-check seam yet, so this runs as
  # a self-contained job here. See docs/decisions/005-opt-in-type-checking.md.
  #
  # Also runs on `push` (adobe/spacecat-api-service#3199): the reusable
  # service-ci workflow's own concurrency group (mysticat-ci service-ci.yaml,
  # keyed on ${{ github.workflow }}-${{ github.ref }} with cancel-in-progress
  # on non-main refs) can cancel a PR's `pull_request`-triggered run of this
  # job, leaving its head commit with no completed run. The `push` run is a
  # fallback, skipped when no open PR exists yet for the branch (nothing to
  # protect on `main` or a pre-PR branch). If the PR-existence lookup itself
  # fails, it runs anyway rather than skip -- this is a required blocking
  # check, and defaulting an inconclusive lookup to "skip" risks reproducing
  # the exact bug being fixed.
  #
  # No concurrency group on this job: the push and pull_request runs are meant
  # to complete independently (that's the whole fix), so nothing here should
  # cancel either one.
  type-check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check for open PR (push only)
        id: pr-check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_COUNT=$(gh pr list --head "$REF_NAME" --state open --repo "$REPO" \
            --json number --jq 'length') || true
          # Match strictly-numeric output, not just non-empty: unexpected stdout
          # ahead of a `gh` failure (e.g. a CLI notice) would otherwise slip past
          # a bare `-z` check and skip the warning below.
          if [[ "$PR_COUNT" =~ ^[0-9]+$ ]]; then
            if [ "$PR_COUNT" = "0" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::No open PR found for the current branch — skipping type-check on this push"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not determine whether an open PR exists for the current branch (gh pr list failed, see log above) — running type-check anyway rather than risk skipping the only completed run for this commit"
          fi

      # steps.pr-check.outputs.skip is an empty string (not 'false') on pull_request
      # events, since the step above doesn't run there -- the '!= true' checks below
      # rely on that negative match; do not refactor them to '== false'.
      - name: Check out
        if: steps.pr-check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        if: steps.pr-check.outputs.skip != 'true'
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Type-check
        if: steps.pr-check.outputs.skip != 'true'
        run: npm run type-check

  # serenity-job-runner WORKER Lambda deploy (adobe/serenity-docs#186). Rationale
  # and design: PR #3191.
  #
  # A SECOND Lambda per service (distinct `hedy --entryFile`, deployed as
  # spacecat-services--serenity-job-runner) that the reusable service-ci workflow
  # can't deploy. Two triggers:
  #   1. push to `main` -> auto-deploy to PROD (the only env with the ESM wired
  #      up — create_serenity_job_runner_esms is prod-only; stage never sets it,
  #      so a stage-deployed worker is functionally inert, nothing ever invokes
  #      it). Stops the worker drifting behind the api-service Lambda —
  #      previously it was manual-dispatch ONLY, so a change merged to the worker
  #      handler (e.g. PR #3138) shipped to api-service but left the worker stale
  #      with no signal until a job failed.
  #   2. workflow_dispatch -> manual single-env deploy (dev, stage, or prod) for
  #      ad-hoc verification; stage is not part of the automatic push path.
  #
  # Deploys on every successful `main`-push `ci` run (service-ci.yaml@v3 exposes no
  # `released` output to gate on): a slight over-deploy that guarantees no drift.
  #
  # !!! DEPLOY != ROLLOUT !!!  This keeps the worker *code* current; it enables the
  # feature for NO ONE. Rollout stays gated by the `create_serenity_job_runner_esms`
  # ESM (Terraform) AND the UI's per-org DB flag. Runs under CI's
  # spacecat-role-github-actions (personal creds lack the needed iam:PassRole).
  deploy-worker:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.environment == 'dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci]
    strategy:
      # Both push and workflow_dispatch resolve to a single-element matrix now
      # (push -> prod only), so fail-fast/max-parallel are no-ops here — kept
      # only so a future multi-env push list stays ordered/serialized by default.
      fail-fast: true
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(github.event_name == 'push' && '["prod"]' || format('["{0}"]', inputs.environment)) }}
    concurrency:
      # Serializes same-env deploys (e.g. a push deploy overlapping a manual
      # workflow_dispatch to the same environment) without blocking other envs.
      group: deploy-worker-${{ matrix.environment }}
      cancel-in-progress: false
    environment: ${{ matrix.environment == 'dev' && 'dev-branches' || matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Configure AWS
        uses: adobe/mysticat-ci/.github/actions/configure-aws@v1
        with:
          # Explicit per-env branches (no fall-through-to-prod default): an
          # unrecognised env yields an empty account id -> an invalid role ARN
          # that fails `configure-aws`, rather than silently assuming prod.
          aws_role_to_assume: ${{ format('arn:aws:iam::{0}:role/spacecat-role-github-actions',
            (matrix.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV)
            || (matrix.environment == 'stage' && secrets.AWS_ACCOUNT_ID_STAGE)
            || (matrix.environment == 'prod' && secrets.AWS_ACCOUNT_ID_PROD)) }}

      - name: Deploy worker
        # dev -> deploy-dev:worker, stage -> deploy-stage:worker,
        # prod -> deploy:worker (see package.json scripts).
        run: npm run ${{ (matrix.environment == 'dev' && 'deploy-dev:worker') || (matrix.environment == 'stage' && 'deploy-stage:worker') || (matrix.environment == 'prod' && 'deploy:worker') }}
        env:
          AWS_REGION: us-east-1
          # hedy resolves --aws-region from this HLX_-prefixed env var, not
          # AWS_REGION/AWS_DEFAULT_REGION (those only configure the AWS SDK
          # client) - the reusable service-ci workflow sets this at its own
          # workflow level, which this repo-local job doesn't inherit.
          HLX_AWS_REGION: us-east-1
          AWS_ACCOUNT_ID: ${{ (matrix.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV) || (matrix.environment == 'stage' && secrets.AWS_ACCOUNT_ID_STAGE) || (matrix.environment == 'prod' && secrets.AWS_ACCOUNT_ID_PROD) }}
          VPC_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          VPC_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          VPC_SG_ID: ${{ secrets.VPC_SG_ID }}
